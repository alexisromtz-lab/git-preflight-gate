# HUELLA-PLATINO-GATE-TEMPLATE-20261031
#
# INSTALACION (1 minuto, 3 pasos):
#   1. Copia este archivo TAL CUAL a  .github/workflows/platino-gate.yml
#   2. Commit y push a una rama, abre un PR.
#   3. Abre la pestana "Summary" del run: ahi esta tu badge, ya rellenado con
#      tu owner/repo. Pega esa linea en tu README.
#
# NO RENOMBRES EL ARCHIVO. El nombre es parte del contrato: el paso
# "contrato-nombre" falla cerrado si el workflow no vive en
# .github/workflows/platino-gate.yml. Motivo medido: el badge de estado se
# resuelve POR NOMBRE DE ARCHIVO; con otro nombre leeria un workflow ajeno
# (tu ci.yml, por ejemplo) y publicaria un verde que no mide este gate.

name: Platino Preflight Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contrato-nombre:
    name: Contrato del nombre
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "El workflow debe vivir en .github/workflows/platino-gate.yml"
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -u
          case "$WORKFLOW_REF" in
            */.github/workflows/platino-gate.yml@*)
              echo "CONTRATO OK: $WORKFLOW_REF"
              ;;
            *)
              echo "CONTRATO ROTO: el workflow vive en '$WORKFLOW_REF'." >&2
              echo "Renombralo a .github/workflows/platino-gate.yml y vuelve a correr." >&2
              echo "El badge de estado se resuelve por nombre de archivo: con otro" >&2
              echo "nombre leeria un workflow ajeno y publicaria un verde falso." >&2
              exit 20
              ;;
          esac

  gate:
    name: Gate
    needs: contrato-nombre
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: gate
        uses: alexisromtz-lab/git-preflight-gate@d1ec4f25bcb719179e09ad4c8b33ae77985711be
        with:
          workflows-dir: .github/workflows
          fail-on-red: "true"
      - name: Veredicto y badge
        if: always()
        shell: bash
        env:
          RC: ${{ steps.gate.outputs.rc }}
          VEREDICTO: ${{ steps.gate.outputs.veredicto }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          {
            echo "## Platino Preflight Gate"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| rc | \`${RC:-NO_MEDIDO}\` |"
            echo "| veredicto | **${VEREDICTO:-NO_MEDIDO}** |"
            echo ""
            echo "### Badge de estado (dinamico, sin permisos de escritura)"
            echo ""
            echo '```markdown'
            URL="https://img.shields.io/github/actions/workflow/status/${REPO}/platino-gate.yml?label=preflight%20gate&branch=${RAMA}"
            echo "[![Platino Preflight Gate](${URL})](https://github.com/alexisromtz-lab/la-auditora)"
            echo '```'
            echo ""
            echo "### Sello estatico (solo con el gate en verde)"
            echo ""
            echo '```markdown'
            echo '[![Audited by Platino Labs](https://img.shields.io/badge/audited_by-Platino_Labs-6f42c1)](https://github.com/alexisromtz-lab/la-auditora)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
