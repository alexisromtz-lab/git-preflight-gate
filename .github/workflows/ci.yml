# HUELLA-CI-TEMPLATE-20261020
# HUELLA-CI-TEMPLATE-FIX-20261020
# HUELLA-CI-TEMPLATE-APPARATUS-20261020
# HUELLA-CI-TEMPLATE-ADOPTABLE-V4-20261020
#
# Plantilla de CI fail-closed para los repositorios que hoy no miden nada.
#
# INERTE EN SU REPO DE ORIGEN POR DISEÑO: el job se declara *skipped* aquí
# (skipped = «no medí», nunca un verde) y solo mide donde se adopta.
#
# ADOPTAR: copiar este archivo a <repo>/.github/workflows/ci.yml .
#   · repo con tests pytest  -> con eso basta (se detectan test_*.py / *_test.py).
#   · repo cuyo aparato NO es pytest (banco .sh, make, script propio) -> declarar
#     el comando en <repo>/.github/ci-apparatus (una línea).
#   Si no hay ni lo uno ni lo otro, el job FALLA: un repo sin aparato no es verde.
#
# FALSIFICADOR (medido, no supuesto) en alexisromtz-lab/ci-fail-closed-falsifier,
# PÚBLICO desde 2026-10-20T22:16:30Z: la cita es auditable sin token (API anónima
# responde 200). Una rama por control, cada una con su corrida completada:
#   sin-aparato     árbol sin tests ni declaración -> rojo  NO_APPARATUS_DECLARED
#   con-test        tests pytest que pasan         -> verde
#   fail-test       tests pytest que fallan        -> rojo
#   main            aparato declarado que pasa     -> verde
#   app-shell-fail  aparato declarado que falla    -> rojo
#
# CORRECCIÓN 1: el guard era `if: hashFiles(...)` a nivel de job; GitHub rechazó
# el workflow entero (0 jobs, «workflow file issue»). `hashFiles` no existe en el
# contexto del `if` de job (github, needs, vars, inputs). Corregido a
# `github.repository`.
# CORRECCIÓN 2: la sonda solo conocía pytest y publicó `NO_TESTS_FOUND` en un repo
# cuyo aparato es un banco bash (git-preflight-gate, tests/must_fail.sh): certificó
# la ausencia de una forma y no de las otras. Ahora el aparato se declara o se
# detecta; el rojo solo cae cuando NO HAY NADA que medir.
# CORRECCIÓN 3 (v4): se rechazó la rama «verde si es un repo de documentación
# declarado». Un verde sin medición no es un repo sano: es la tautología F-D1 con
# check verde. El repo sin aparato sale ROJO (NO_APPARATUS_DECLARED) hasta que
# declare un comando que mida algo; el silencio se declara skipped, nunca verde.
# CORRECCIÓN 4 (v4): `pip install` ya no asume manifiesto — 0 de 15 repos públicos
# tienen requirements.txt (medido 2026-10-20T22:05Z). La ausencia de manifiesto es
# una rama declarada (SIN_MANIFIESTO), no un fallo tragado: si el manifiesto existe
# y la instalación falla, es rojo.

name: ci-fail-closed

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository != 'alexisromtz-lab/platino-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Resolver el aparato (declarado gana a detectado)
        run: |
          set -euo pipefail
          if [ -f .github/ci-apparatus ]; then
            cmd=$(tr -d '\r' < .github/ci-apparatus | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' | head -n 1)
            if [ -z "$cmd" ]; then
              echo "APPARATUS_EMPTY: .github/ci-apparatus existe pero no declara comando — failing closed."
              exit 1
            fi
            echo "APPARATUS_DECLARED: $cmd"
            printf 'APPARATUS=%s\n' "$cmd" >> "$GITHUB_ENV"
          elif [ -n "$(find . \( -name 'test_*.py' -o -name '*_test.py' \) \
                        -not -path './.git/*' -not -path '*/node_modules/*' \
                        -not -path './.venv/*' -print -quit)" ]; then
            echo "APPARATUS_DETECTED: pytest"
            echo "APPARATUS=pytest" >> "$GITHUB_ENV"
          else
            echo "NO_APPARATUS_DECLARED: no .github/ci-apparatus and no test_*.py / *_test.py — failing closed."
            exit 1
          fi

      - name: Instalar dependencias (falla cerrado)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip > /dev/null
          python -m pip install pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          else
            echo "SIN_MANIFIESTO: no requirements.txt ni pyproject.toml — pytest pelado."
          fi

      - name: Correr el aparato
        run: |
          set -euo pipefail
          set +e
          if [ "$APPARATUS" = "pytest" ]; then
            python -m pytest -q
          else
            echo "RUN_APPARATUS: $APPARATUS"
            bash -c "$APPARATUS"
          fi
          rc=$?
          set -e
          if [ "$APPARATUS" = "pytest" ] && [ "$rc" -eq 5 ]; then
            echo "NO_TESTS_COLLECTED: pytest no recogió ningún test — failing closed."
            exit 1
          fi
          echo "APPARATUS_RC=$rc"
          exit "$rc"
