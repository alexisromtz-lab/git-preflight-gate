# HUELLA-CI-TEMPLATE-20261020
# HUELLA-CI-TEMPLATE-FIX-20261020
#
# Plantilla de CI fail-closed para los repositorios que hoy no miden nada.
#
# INERTE EN SU REPO DE ORIGEN POR DISEÑO: el job se declara *skipped* aquí
# (skipped = «no medí», nunca un verde) y solo mide donde se adopta.
#
# ADOPTAR: copiar este archivo a <repo>/.github/workflows/ci.yml . Una pieza.
#
# FALSIFICADOR (medido, no supuesto) en alexisromtz-lab/ci-fail-closed-falsifier:
#   árbol sin tests      -> rojo   NO_TESTS_FOUND
#   tests que pasan      -> verde
#   tests que fallan     -> rojo   (prueba que pytest corre de verdad)
#
# CORRECCIÓN DE LA PRIMERA VERSIÓN: el guard era `if: hashFiles(...)` a nivel de
# job; GitHub rechazó el workflow entero (0 jobs, «workflow file issue»).
# `hashFiles` no existe en el contexto del `if` de job — disponibles: github,
# needs, vars, inputs. Se corrigió a `github.repository`, que sí está.

name: ci-fail-closed

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository != 'alexisromtz-lab/platino-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Probar existencia de tests (fail-closed)
        run: |
          set -euo pipefail
          found=$(find . \( -name 'test_*.py' -o -name '*_test.py' \) \
                    -not -path './.git/*' -not -path '*/node_modules/*' \
                    -not -path './.venv/*' -print -quit)
          if [ -z "$found" ]; then
            echo "NO_TESTS_FOUND: no test_*.py / *_test.py in the tree — failing closed."
            exit 1
          fi
          echo "TESTS_FOUND: $found"

      - name: Instalar dependencias (falla cerrado)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip > /dev/null
          python -m pip install pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          else
            echo "SIN_MANIFIESTO: no requirements.txt ni pyproject.toml — pytest pelado."
          fi

      - name: Correr tests (cero recogidos = rojo)
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "NO_TESTS_COLLECTED: pytest no recogió ningún test — failing closed."
            exit 1
          fi
          exit "$rc"
