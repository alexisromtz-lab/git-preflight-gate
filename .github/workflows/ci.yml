# HUELLA-CI-TEMPLATE-20261020
# HUELLA-CI-TEMPLATE-FIX-20261020
# HUELLA-CI-TEMPLATE-APPARATUS-20261020
# HUELLA-CI-TEMPLATE-ADOPTABLE-V4-20261020
# HUELLA-CI-PYTHON-V5-PROHIBICION-EVAL-20261020
# HUELLA-CI-PYTHON-V5-ERRATA-1-CONTE-DECORADO-20261020
# HUELLA-CI-PY-V6-INSTRUMENTO-20261020
# HUELLA-CI-PY-V7-MODO-COMPUESTO-20261020
# HUELLA-CI-PY-V8-SIN-DETECCION-20261020
#
# CORRECCIÓN 10 (v8, sin detección): se RETIRA la rama de DETECCIÓN. v7
# autodeclaraba: sin `.github/ci-apparatus` y con cualquier `test_*.py` presente
# escribía `APPARATUS_DETECTED: pytest`, `MIDE=tests`, `EVIDENCIA=junitxml`,
# `ORIGEN=detectado` y el job firmaba VERDE. Medido en el falsador de esta misma
# ley (caso C4, acta ACTA_GW_DECLARACION_20261020.md §4): borrar la declaración
# de un repo con tests devolvía verde. La detección no es una declaración: es
# una suposición del instrumento, y una suposición con rc 0 es exactamente el
# falso verde que esta ley existe para matar. v8: sin `.github/ci-apparatus` el
# job cae con NO_APPARATUS_DECLARED, tenga o no archivos `test_*.py`.
#   · Riesgo medido antes de escribir, no supuesto: censo por API 2026-10-21T02:0xZ
#     sobre los 15 repos que montan esta ley en `main` -> 15 declaran, 0 firmaban
#     por detección. La v8 no pone rojo a ningún adoptante legítimo.
#   · Se retira con ella la segunda rama muerta de la guarda de vacuidad
#     (`VACUIDAD_OK` / `NO_TESTS_FOUND`, que solo se alcanzaba con
#     ORIGEN=detectado). `ORIGEN` sigue en el entorno para el contrato de la
#     guarda, pero ya no tiene más valor que `declarado`.
#   · LÍMITE DECLARADO: el contrato no puede distinguir un `ci-apparatus`
#     declarado a mano de uno generado; v8 exige que EXISTA y que su evidencia
#     verifique, no que alguien lo haya pensado.
#
# CORRECCIÓN 9 (v7, modo compuesto): medido 2026-10-21T01:39Z en los logs de
# fotonica-monotile (run 39528566405) y optica-kerr-2d (run 39528573559), hay
# aparatos que MIDEN DOS COSAS y solo certifican una:
# `python .github/verify_manifest.py && python -m pytest -q tests` declarado
# `mide: manifiesto` corre pytest — la cadena `&&` propaga su rc, así que un
# test rojo YA ponía el job rojo (no era un falso verde de rc) — pero el
# certificado habla sólo de artefactos: «MANIFIESTO_SANO: 17» con «19 passed»
# en el log, «MANIFIESTO_SANO: 21» con «9 passed». El conteo de tests existía
# en el TEXTO y no en el CONTRATO: declarado, no exigido. v7 admite `mide:`
# COMPUESTO (`manifiesto+tests`) y `evidencia:` como lista separada por `;`:
# el token `junitxml` certifica los tests con el instrumento de la v6, el regex
# certifica el veredicto textual con el entero > 0 de la v5, y TODOS los modos
# declarados tienen que verificar o el job cae con EVIDENCIA_INCOMPLETA.
#   · No relaja nada: sigue prohibido el eval en línea, sigue exigido el parseo
#     de <testcase> cuando hay tests y el entero > 0 cuando hay manifiesto.
#   · El orden de verificación es fijo (sintaxis -> manifiesto/banco -> tests);
#     el orden de `mide:` documenta la intención, no cambia qué se ejecuta: el
#     que manda sobre la ejecución es `comando:`.
#   · Compatibilidad medida, no supuesta: `mide:` de un solo valor se comporta
#     exactamente igual que en v6 (14 repos verdes con la v6; el falsador local
#     cubre el control de no-regresión).
#   · `manifiesto+banco` se rechaza: dos veredictos textuales en un solo
#     aparato no se pueden atribuir a cuál de los dos imprimió qué.
#
# CORRECCIÓN 8 (v6, instrumento): se RETIRA la matriz de texto. El texto del
# runner no es un contrato: cambia con la versión, con el reporter y con la
# terminal (sangría de mocha, glifo «ℹ» de node 24, `===== 26 passed =====` de
# pytest sin -q: tres falsos rojos medidos, uno por formato). v6 mide el
# INSTRUMENTO: `mide: tests` exige `evidencia: junitxml`, el comando escribe
# /tmp/junit.xml y el veredicto se cuenta sobre elementos <testcase>.
#   · Se rechaza `grep -oP '(?<=tests=")'` + `head -1` como se dictó: `-P` no es
#     portable y `head -1` toma el primer <testsuite>, que en un informe con
#     varios ficheros o clases SUBCUENTA. Se cuentan los <testcase> del árbol.
#   · Se rechaza que el script AÑADA `--junitxml` si falta: inyectar el flag es
#     la misma reescritura oculta que la ERRATA 2 (`pytest` -> `python -m
#     pytest -q`). El flag va en la declaración, donde se ve.
#   · El XML manda sobre el rc: un envoltorio que se coma el rc pero deje
#     <failure> en el informe cae en TESTS_FAILED.
#   · Casos omitidos: 0 ejecutados de N casos es VACUIDAD_SKIP. Medir el
#     instrumento incluye medir que el instrumento midió algo.
#   · LÍMITE DECLARADO: un aparato que ESCRIBA un XML falso a mano pasa el
#     contador. El XML no distingue quién lo escribió; eso lo declara el humano
#     en `comando:` y ninguna evidencia EN BANDA puede refutarlo. Se cierra el
#     archivo viejo (mtime anterior a la corrida -> JUNIT_VIEJO), no la mentira.
#
# ERRATA 1 (v5, medida en producción): el parseador de conteo no conocía el
# formato NO silencioso de pytest — `====== 26 passed in 0.10s ======` — y puso
# en rojo con VACUIDAD_EJECUCION a protocol-core (run 39515729665),
# protocol-core-dist y motor-nesting, que SÍ habían ejecutado 26, 8 y 4 tests.
# La decoración `=` al inicio de la línea hacía fallar el ancla `^\s*`. Es el
# tercer falso rojo de la familia (antes: sangría de mocha, glifo ℹ de node).
# Cura: ancla por NO-alfanumérico (`^[^A-Za-z0-9]*`) y se recupera `N passing`
# de mocha, que la v5 había perdido al reescribir la matriz.
#
# Plantilla de CI fail-closed para los repositorios que hoy no miden nada.
#
# INERTE EN SU REPO DE ORIGEN POR DISEÑO: el job se declara *skipped* aquí
# (skipped = «no medí», nunca un verde) y solo mide donde se adopta.
#
# ADOPTAR: copiar este archivo a <repo>/.github/workflows/ci.yml .
#   · v8: SIN `.github/ci-apparatus` el job FALLA (NO_APPARATUS_DECLARED). Ya no
#     hay «con eso basta»: un repo con tests pytest declara igual su aparato.
#       comando: python -m pytest -q tests --junitxml=/tmp/junit.xml
#       mide: tests
#       evidencia: junitxml
#   · repo cuyo aparato NO es pytest -> declarar el contrato de TRES campos en
#     <repo>/.github/ci-apparatus:
#
#         comando: <comando real, nunca eval en línea>
#         mide: tests | sintaxis | manifiesto | banco
#                  | manifiesto+tests     # COMPUESTO (v7): todos los modos que
#                  | banco+tests          #   se declaren tienen que verificar
#         evidencia: junitxml            # obligatorio si mide=tests
#                  | <regex literal>     # obligatorio si mide=manifiesto | banco
#                  | <regex literal>; junitxml   # COMPUESTO (v7): lista con `;`
#
#     · compuesto  -> `mide: manifiesto+tests` exige LAS DOS evidencias: el regex
#                     (con entero > 0) y el token junitxml. Si falta una,
#                     EVIDENCIA_INCOMPLETA nombra cuál. Un certificado que cubre
#                     un modo y no el otro es el agujero que v7 cierra.
#     · tests      -> el comando DEBE escribir /tmp/junit.xml y se declara
#                     `--junitxml=/tmp/junit.xml` dentro de `comando:`. El
#                     veredicto se cuenta sobre <testcase>, no sobre el texto.
#     · sintaxis   -> un chequeador de la whitelist (py_compile | compileall |
#                     mypy | ruff | flake8 | pylint | pyright), vía `-m` si es python.
#     · manifiesto -> veredicto con conteo (el "N" del veredicto tiene que ser > 0).
#     · banco      -> veredicto de banco de casos con conteo (> 0).
#     · binario    -> RESERVADO, no implementado: falla (un tipo sin implementar
#                     no puede firmar verde).
#   La declaración de UN solo campo ya no vale: sin `mide:` no hay forma de saber
#   qué se midió, y un rc 0 sin tipo es una exención con forma de agujero.
#   Si no hay ni lo uno ni lo otro, el job FALLA: un repo sin aparato no es verde.
#
# CORRECCIÓN 5 (v5): medido el 2026-10-20 contra la plantilla v4 de este mismo
# repo, la rama `python-hueco-eval-ciego` (run 39513892220) declaraba
# `python -c 'pass'` y el CI FIRMÓ VERDE: cero mediciones, certificado firmado,
# en los 14 repos que usan esta plantilla. El contrato de un campo no puede
# distinguir «el aparato midió» de «el aparato dijo que sí». v5 prohíbe la
# evaluación en línea y exige tipo + evidencia por tipo.
# CORRECCIÓN 6 (v5): se rechaza la whitelist CERRADA de runners que se dictó para
# Node. En este portafolio hay aparatos que no son runners (verify_manifest.py,
# bancos must-fail en bash) y una whitelist de runners los habría puesto rojos a
# los que hoy están verdes. La forma correcta es lista negra (lo que no puede ser)
# + tipo declarado + evidencia declarada.
# CORRECCIÓN 7 (v5): `mide: binario` queda RESERVADO sin implementar. Un tipo que
# el workflow no sabe verificar es una exención; y una exención con rc 0 es el
# falso verde que esta ley existe para matar. Se declara MIDE_NO_IMPLEMENTADO.
#   · Reparto medido (2026-10-20): 7 repos `python .github/verify_manifest.py`
#     (manifiesto) · 2 repos manifiesto+pytest · 5 repos pytest (tests) ·
#     3 repos banco must-fail (banco) · 3 repos sin declaración (detección pytest).
#   · Reparto medido para v6 (2026-10-20T23:4x Z, por declaración): 7 repos
#     `mide: tests` (migran a junitxml) · 7 `manifiesto` · 3 `banco` · 3 sin
#     declaración (detección, el workflow les pone el flag) · 2 Node (otra ley).
#
# FALSIFICADOR (medido, no supuesto) en alexisromtz-lab/ci-fail-closed-falsifier,
# PÚBLICO desde 2026-10-20T22:16:30Z: la cita es auditable sin token (API anónima
# responde 200). Una rama por control, cada una con su corrida completada:
#   sin-aparato     árbol sin tests ni declaración -> rojo  NO_APPARATUS_DECLARED
#   con-test        tests pytest que pasan         -> verde
#   fail-test       tests pytest que fallan        -> rojo
#   main            aparato declarado que pasa     -> verde
#   app-shell-fail  aparato declarado que falla    -> rojo
#
# CORRECCIÓN 1: el guard era `if: hashFiles(...)` a nivel de job; GitHub rechazó
# el workflow entero (0 jobs, «workflow file issue»). `hashFiles` no existe en el
# contexto del `if` de job (github, needs, vars, inputs). Corregido a
# `github.repository`.
# CORRECCIÓN 2: la sonda solo conocía pytest y publicó `NO_TESTS_FOUND` en un repo
# cuyo aparato es un banco bash (git-preflight-gate, tests/must_fail.sh): certificó
# la ausencia de una forma y no de las otras. Ahora el aparato se declara o se
# detecta; el rojo solo cae cuando NO HAY NADA que medir.
# CORRECCIÓN 3 (v4): se rechazó la rama «verde si es un repo de documentación
# declarado». Un verde sin medición no es un repo sano: es la tautología F-D1 con
# check verde. El repo sin aparato sale ROJO (NO_APPARATUS_DECLARED) hasta que
# declare un comando que mida algo; el silencio se declara skipped, nunca verde.
# CORRECCIÓN 4 (v4): `pip install` ya no asume manifiesto — 0 de 15 repos públicos
# tienen requirements.txt (medido 2026-10-20T22:05Z). La ausencia de manifiesto es
# una rama declarada (SIN_MANIFIESTO), no un fallo tragado: si el manifiesto existe
# y la instalación falla, es rojo.

name: ci-fail-closed

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository != 'alexisromtz-lab/platino-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Resolver el aparato (contrato v8 — declaración obligatoria, sin detección)
        run: |
          set -euo pipefail
          if [ -f .github/ci-apparatus ]; then
            campos=$(tr -d '\r' < .github/ci-apparatus \
              | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' || true)
            cmd=$(printf '%s\n' "$campos" | sed -n 's/^[[:space:]]*comando:[[:space:]]*//p' | head -n 1)
            mide=$(printf '%s\n' "$campos" | sed -n 's/^[[:space:]]*mide:[[:space:]]*//p' | head -n 1)
            evid=$(printf '%s\n' "$campos" | sed -n 's/^[[:space:]]*evidencia:[[:space:]]*//p' | head -n 1)
            suelta=$(printf '%s\n' "$campos" | grep -vE '^[[:space:]]*(comando|mide|evidencia):' | head -n 1 || true)
            if [ -z "$cmd" ] && [ -n "$suelta" ]; then
              echo "APPARATUS_SIN_TIPO: declaración de un solo campo ('$suelta'). El contrato v6 exige 'comando:' + 'mide:' + 'evidencia:' (junitxml si mide=tests; regex si mide=manifiesto o banco) — failing closed."
              exit 1
            fi
            if [ -z "$cmd" ] || [ -z "$mide" ]; then
              echo "APPARATUS_EMPTY: .github/ci-apparatus no declara 'comando:' y 'mide:' a la vez — failing closed."
              exit 1
            fi
            {
              printf 'APPARATUS=%s\n' "$cmd"
              printf 'MIDE=%s\n' "$mide"
              printf 'EVIDENCIA=%s\n' "$evid"
              printf 'ORIGEN=declarado\n'
            } >> "$GITHUB_ENV"
            echo "APPARATUS_DECLARED: $cmd"
            echo "APPARATUS_MIDE: $mide"
          else
            echo "NO_APPARATUS_DECLARED: no .github/ci-apparatus — failing closed (v8 retiró la detección: un repo con test_*.py también declara su aparato)."
            exit 1
          fi

      - name: Validar la declaración (v8 — eval en línea prohibido, modo(s) y evidencia(s))
        run: |
          set -euo pipefail
          modos_decl=$(printf '%s' "$MIDE" | tr '+' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)
          tiene_modo() { printf '%s\n' "$modos_decl" | grep -qx "$1"; }
          tiene_ev()   { printf '%s' "$EVIDENCIA" | tr ';' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qx "$1"; }
          EV_REGEX=$(printf '%s' "$EVIDENCIA" | tr ';' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | grep -vx 'junitxml' | paste -sd';' - || true)
          case "$MIDE" in
            *+*)
              if [ -z "$modos_decl" ]; then
                echo "APPARATUS_MIDE: modo compuesto vacío en 'mide: $MIDE' — failing closed."
                exit 1
              fi
              if tiene_modo binario; then
                echo "MIDE_NO_IMPLEMENTADO: 'mide: binario' está reservado y no implementado; un tipo sin implementación no puede firmar verde — failing closed."
                exit 1
              fi
              suelto=$(printf '%s\n' "$modos_decl" | grep -vxE 'tests|sintaxis|manifiesto|banco' | head -n 1 || true)
              if [ -n "$suelto" ]; then
                echo "APPARATUS_TIPO_DESCONOCIDO: 'mide: $suelto' fuera del vocabulario (tests | sintaxis | manifiesto | banco) — failing closed."
                exit 1
              fi
              if tiene_modo manifiesto && tiene_modo banco; then
                echo "APPARATUS_MIDE: 'manifiesto+banco' es ambiguo (dos veredictos textuales en un solo aparato: el certificado no puede atribuir cuál imprimió qué) — failing closed."
                exit 1
              fi
              if tiene_modo tests && ! tiene_ev 'junitxml'; then
                echo "EVIDENCIA_INCOMPLETA: junitxml — 'mide: $MIDE' declara tests y 'evidencia:' no trae el token junitxml (declara 'evidencia: <regex>; junitxml' y escribe /tmp/junit.xml con --junitxml=) — failing closed."
                exit 1
              fi
              if (tiene_modo manifiesto || tiene_modo banco) && [ -z "$EV_REGEX" ]; then
                echo "EVIDENCIA_INCOMPLETA: manifiesto — 'mide: $MIDE' declara un veredicto textual y 'evidencia:' no trae su regex (la que imprime el entero > 0) — failing closed."
                exit 1
              fi
              echo "COMPUESTO_DECLARADO: modos=$(printf '%s' "$modos_decl" | paste -sd'+' -) · evidencia_textual=/${EV_REGEX:-—}/ · junitxml=$(tiene_ev 'junitxml' && echo si || echo no)"
              ;;
            tests|sintaxis|manifiesto|banco) ;;
            binario)
              echo "MIDE_NO_IMPLEMENTADO: 'mide: binario' está reservado y no implementado; un tipo sin implementación no puede firmar verde — failing closed."
              exit 1 ;;
            *)
              echo "APPARATUS_TIPO_DESCONOCIDO: 'mide: $MIDE' fuera del vocabulario (tests | sintaxis | manifiesto | banco) — failing closed."
              exit 1 ;;
          esac

          primer=$(printf '%s' "$APPARATUS" | awk '{print $1}')
          resto=$(printf '%s' "$APPARATUS" | cut -s -d' ' -f2-)
          if [ "$primer" = "env" ]; then
            primer=$(printf '%s' "$resto" | awk '{print $1}')
            resto=$(printf '%s' "$resto" | cut -s -d' ' -f2-)
          fi
          base=${primer##*/}
          case "$base" in
            true|false|:|echo|printf|exit)
              echo "APPARATUS_VACUO: '$APPARATUS' no mide nada — failing closed."
              exit 1 ;;
            eval|exec|source|.)
              echo "APPARATUS_INVALIDO: '$APPARATUS' evalúa en línea; la evidencia tiene que ser un archivo versionado — failing closed."
              exit 1 ;;
            python|python3|pypy|pypy3)
              if printf '%s' "$resto" | grep -qE '(^|[[:space:]])-c([[:space:]]|=|$)'; then
                echo "APPARATUS_INVALIDO: '$base -c' evalúa en línea; la evidencia tiene que ser un archivo versionado — failing closed."
                exit 1
              fi
              if printf '%s' "$resto" | grep -qE '(^|[[:space:]])-([[:space:]]|$)'; then
                echo "APPARATUS_INVALIDO: '$base -' lee el programa de la entrada estándar; la evidencia tiene que ser un archivo versionado — failing closed."
                exit 1
              fi ;;
            bash|sh|zsh|dash|ksh)
              if printf '%s' "$resto" | grep -qE '(^|[[:space:]])-c([[:space:]]|=|$)'; then
                echo "APPARATUS_INVALIDO: '$base -c' evalúa en línea; el banco de casos tiene que ser un archivo versionado — failing closed."
                exit 1
              fi ;;
          esac

          if tiene_modo sintaxis; then
            chequeador=$base
            case "$base" in
              python|python3|pypy|pypy3)
                if ! printf '%s' "$resto" | grep -qE '(^|[[:space:]])-m([[:space:]]|=|$)'; then
                  echo "APPARATUS_INVALIDO: mide=sintaxis con '$base' exige '-m <chequeador>': la sintaxis se mide con un chequeador, no ejecutando el código — failing closed."
                  exit 1
                fi
                chequeador=$(printf '%s' "$resto" | sed -n 's/.*-m[[:space:]]*=*\([^[:space:]]*\).*/\1/p' | head -n 1) ;;
            esac
            case "$chequeador" in
              py_compile|compileall|mypy|ruff|flake8|pylint|pyright) ;;
              *)
                echo "APPARATUS_INVALIDO: mide=sintaxis pero '$chequeador' no es un chequeador de la whitelist (py_compile | compileall | mypy | ruff | flake8 | pylint | pyright) — failing closed."
                exit 1 ;;
            esac
            echo "SINTAXIS_DECLARADA: chequeador '$chequeador'."
          fi

          if tiene_modo manifiesto || tiene_modo banco; then
            if [ -z "$EV_REGEX" ]; then
              echo "APPARATUS_SIN_EVIDENCIA: mide=$MIDE exige 'evidencia:' (el regex que el verificador imprime al medir); sin ella un rc 0 no distingue medir de no medir — failing closed."
              exit 1
            fi
            echo "EVIDENCIA_DECLARADA: /$EV_REGEX/"
          fi

          if tiene_modo tests && ! tiene_ev junitxml; then
            echo "APPARATUS_INCOMPATIBLE: mide=$MIDE exige 'evidencia: junitxml' y que 'comando:' escriba /tmp/junit.xml con --junitxml=...; contar el texto del runner no es contrato (tres falsos rojos medidos: sangría de mocha, glifo de node 24, decorado '===== N passed =====' de pytest) — failing closed."
            exit 1
          fi
          if tiene_ev junitxml && ! tiene_modo tests; then
            echo "APPARATUS_INCOMPATIBLE: 'evidencia: junitxml' solo vale si 'mide:' declara tests; mide=$MIDE exige el regex literal que imprime su verificador — failing closed."
            exit 1
          fi
          echo "DECLARACION_OK: mide=$MIDE · $APPARATUS · evidencia=${EVIDENCIA:-—}"

      - name: Guarda de vacuidad (v8 — un aparato se juzga por su evidencia)
        run: |
          set -euo pipefail
          echo "VACUIDAD_DELEGADA: aparato declarado (ORIGEN=$ORIGEN); la evidencia la exigen 'Validar la declaración' y 'Correr el aparato' según mide=$MIDE."

      - name: Instalar dependencias (falla cerrado)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip > /dev/null
          python -m pip install pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          else
            echo "SIN_MANIFIESTO: no requirements.txt ni pyproject.toml — pytest pelado."
          fi

      - name: Correr el aparato (v7 — rc, evidencia por modo e instrumento junitxml)
        run: |
          set -euo pipefail
          modos_decl=$(printf '%s' "$MIDE" | tr '+' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)
          tiene_modo() { printf '%s\n' "$modos_decl" | grep -qx "$1"; }
          tiene_ev()   { printf '%s' "$EVIDENCIA" | tr ';' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qx "$1"; }
          EV_REGEX=$(printf '%s' "$EVIDENCIA" | tr ';' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | grep -vx 'junitxml' | paste -sd';' - || true)
          compuesto=0
          case "$MIDE" in *+*) compuesto=1 ;; esac
          echo "RUN_APPARATUS: $APPARATUS"
          rm -f /tmp/junit.xml
          inicio=$(date +%s)
          log=$(mktemp)
          set +e
          bash -c "$APPARATUS" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "APPARATUS_RC=$rc"
          if tiene_modo tests && [ "$rc" -eq 5 ]; then
            echo "NO_TESTS_COLLECTED: pytest no recogió ningún test (rc 5) — failing closed."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          if tiene_modo sintaxis; then
            if [ -n "$EV_REGEX" ] && ! grep -qE "$EV_REGEX" "$log"; then
              echo "VACUIDAD_EVIDENCIA: mide=$MIDE con rc 0 pero la evidencia declarada /$EV_REGEX/ no aparece en la salida — failing closed."
              exit 1
            fi
            msg="SINTAXIS_OK: rc 0 del chequeador '$APPARATUS'"
            if [ -n "$EV_REGEX" ]; then msg="$msg · evidencia /$EV_REGEX/"; fi
            echo "$msg"
            if [ "$compuesto" -eq 0 ]; then exit 0; fi
          fi

          if tiene_modo manifiesto || tiene_modo banco; then
            if tiene_modo manifiesto; then etq=MANIFIESTO; else etq=BANCO; fi
            if ! grep -qE "$EV_REGEX" "$log"; then
              echo "VACUIDAD_${etq}: la evidencia declarada /$EV_REGEX/ no aparece en la salida; un rc 0 sin veredicto no es una medida — failing closed."
              exit 1
            fi
            if ! grep -E "$EV_REGEX" "$log" | grep -qE '[1-9]'; then
              echo "VACUIDAD_${etq}: la evidencia /$EV_REGEX/ no trae ningún entero > 0; un veredicto sobre 0 elementos no mide nada — failing closed."
              exit 1
            fi
            echo "${etq}_OK: evidencia /$EV_REGEX/ presente y con conteo."
            if [ "$compuesto" -eq 0 ]; then exit 0; fi
          fi

          if ! tiene_modo tests; then
            echo "APPARATUS_MIDE: mide=$MIDE no declara ningún modo verificable por este paso — failing closed."
            exit 1
          fi

          set +e
          python3 - "$inicio" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          RUTA = '/tmp/junit.xml'
          inicio = int(sys.argv[1]) if len(sys.argv) > 1 else 0

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          if not os.path.exists(RUTA):
              print("NO_JUNITXML: mide=tests y el aparato no generó /tmp/junit.xml "
                    "(declara --junitxml=/tmp/junit.xml dentro de 'comando:') — failing closed.")
              sys.exit(1)

          mtime = int(os.path.getmtime(RUTA))
          if inicio and mtime < inicio - 1:
              print(f"JUNIT_VIEJO: /tmp/junit.xml es anterior a esta corrida "
                    f"(mtime {mtime} < inicio {inicio}); ese informe no lo produjo el aparato — failing closed.")
              sys.exit(1)

          try:
              raiz = ET.parse(RUTA).getroot()
          except Exception as e:
              print(f"JUNIT_INVALIDO: /tmp/junit.xml no parsea ({e}) — failing closed.")
              sys.exit(1)

          casos = [e for e in raiz.iter() if local(e.tag) == 'testcase']
          if not casos:
              print("NO_TESTS: el informe no tiene ningún elemento <testcase>; "
                    "un informe sin casos no mide nada — failing closed.")
              sys.exit(1)

          fallos = errores = omitidos = 0
          for c in casos:
              hijos = {local(h.tag) for h in c}
              if 'failure' in hijos:
                  fallos += 1
              if 'error' in hijos:
                  errores += 1
              if 'skipped' in hijos:
                  omitidos += 1

          if fallos or errores:
              print(f"TESTS_FAILED: {fallos} fallo(s) y {errores} error(es) en {len(casos)} casos "
                    f"según el informe; el informe manda sobre el rc — failing closed.")
              sys.exit(1)

          medidos = len(casos) - omitidos
          if medidos < 1:
              print(f"VACUIDAD_SKIP: los {len(casos)} casos del informe están omitidos; "
                    f"un verde de casos que no corrieron es un falso verde — failing closed.")
              sys.exit(1)

          print(f"EJECUCION_OK: {medidos} test(s) ejecutados de {len(casos)} casos · "
                f"{fallos} fallos · {errores} errores · {omitidos} omitidos (junitxml).")
          PY
          rc2=$?
          set -e
          if [ "$rc2" -ne 0 ]; then
            echo "EJECUCION_RC=$rc2"
            exit "$rc2"
          fi
          if [ "$compuesto" -eq 1 ]; then
            echo "COMPUESTO_OK: $(printf '%s' "$modos_decl" | paste -sd'+' -) verificados — el certificado cubre TODAS las evidencias declaradas."
          fi
